<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- user-scalable=no stops the page zooming when you tap the buttons fast -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#2b7a3d">
  <title>Auto Rally</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #1d3b24; color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;          /* no scrolling / pinch-zoom while playing */
      user-select: none; -webkit-user-select: none;
    }
    #wrap {
      position: relative; height: 100%;
      max-width: 480px; margin: 0 auto;
    }
    #game { display: block; width: 100%; height: 100%; }

    /* Top bar: coins, lap, timer, mute */
    #hud {
      position: absolute; top: 8px; left: 8px; right: 8px;
      display: flex; gap: 6px; align-items: center;
      font-weight: 700; font-size: 18px; pointer-events: none;
    }
    .pill { background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 999px; }
    #muteBtn {
      margin-left: auto; pointer-events: auto;
      font-size: 20px; border: 0; border-radius: 999px;
      background: rgba(0,0,0,.55); color: #fff; padding: 6px 12px;
    }

    /* Touch steering buttons */
    .steer {
      position: absolute; bottom: 16px; width: 42%; height: 90px;
      border: 0; border-radius: 18px;
      background: rgba(255,255,255,.22); color: #fff;
      font-size: 40px; font-weight: 700;
    }
    .steer.on { background: rgba(255,255,255,.45); }
    #leftBtn { left: 4%; }
    #rightBtn { right: 4%; }

    /* Start / game over screen (scrolls if the phone is short) */
    #menu {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      overflow-y: auto; touch-action: pan-y;
      padding: 16px; text-align: center;
      background: rgba(0,0,0,.72);
    }
    #menuInner {
      margin: auto; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    #menu h1 { margin: 0; font-size: 38px; color: #ffd23f; }
    #menu p { margin: 0; font-size: 16px; line-height: 1.45; }
    .modes { display: flex; gap: 10px; }
    .modes button {
      font-size: 20px; font-weight: 700; padding: 12px 18px;
      border: 0; border-radius: 14px; background: #ffd23f; color: #222;
    }

    /* Garage (shop) */
    #garage {
      width: 100%; max-width: 360px;
      background: rgba(255,255,255,.08); border-radius: 14px; padding: 10px;
    }
    .garage-head { display: flex; justify-content: space-between; font-size: 18px; }
    #preview { width: 100px; height: 100px; display: block; margin: 4px auto; }
    .choices { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 6px; }
    .choice {
      font-size: 14px; padding: 8px 10px; border-radius: 10px;
      border: 2px solid transparent; background: #3a3f46; color: #fff;
    }
    .choice.locked { opacity: .65; }
    .choice.selected { border-color: #ffd23f; }
    #shopMsg { min-height: 20px; font-size: 14px !important; color: #ffd23f; margin-top: 6px !important; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <div id="hud">
      <span class="pill" id="coins">🪙 0</span>
      <span class="pill" id="lap">Lap 1/3</span>
      <span class="pill" id="timer">0:00.0</span>
      <button id="muteBtn" aria-label="Mute or unmute sound">🔊</button>
    </div>

    <button class="steer" id="leftBtn" aria-label="Steer left">◀</button>
    <button class="steer" id="rightBtn" aria-label="Steer right">▶</button>

    <div id="menu">
      <div id="menuInner">
        <h1>Auto Rally</h1>
        <p id="menuText">
          Steer with ◀ ▶ (or arrow keys / A D).<br>
          Hit a cone or the track edge = <b>game over</b>.<br>
          Potholes slow you down. ⚡ = speed boost.<br>
          Collect 🪙 coins to buy autos in the Garage.
        </p>
        <p id="bestText"></p>
        <div class="modes">
          <button id="raceBtn">3-Lap Race</button>
          <button id="endlessBtn">Endless</button>
        </div>

        <div id="garage">
          <div class="garage-head"><b>Garage</b><span id="wallet">🪙 0</span></div>
          <canvas id="preview" width="200" height="200"></canvas>
          <div class="choices" id="designChoices"></div>
          <div class="choices" id="colorChoices"></div>
          <p id="shopMsg"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    // Register the service worker so the game works offline (flight mode).
    // It only works on https:// or http://localhost.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.log('Service worker not registered:', e);
      });
    }
  </script>
</body>
</html>
