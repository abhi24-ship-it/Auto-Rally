<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- user-scalable=no stops the page zooming when you tap the buttons fast -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#2b7a3d">
  <title>Auto Rally</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #1d3b24; color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;          /* no scrolling / pinch-zoom while playing */
      user-select: none; -webkit-user-select: none;
    }
    #wrap {
      position: relative; height: 100%;
      max-width: 480px; margin: 0 auto;
    }
    canvas { display: block; width: 100%; height: 100%; }

    /* Top bar: coins, lap, timer, mute */
    #hud {
      position: absolute; top: 8px; left: 8px; right: 8px;
      display: flex; gap: 6px; align-items: center;
      font-weight: 700; font-size: 18px; pointer-events: none;
    }
    .pill { background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 999px; }
    #muteBtn {
      margin-left: auto; pointer-events: auto;
      font-size: 20px; border: 0; border-radius: 999px;
      background: rgba(0,0,0,.55); color: #fff; padding: 6px 12px;
    }

    /* Touch steering buttons */
    .steer {
      position: absolute; bottom: 16px; width: 42%; height: 90px;
      border: 0; border-radius: 18px;
      background: rgba(255,255,255,.22); color: #fff;
      font-size: 40px; font-weight: 700;
    }
    .steer.on { background: rgba(255,255,255,.45); }
    #leftBtn { left: 4%; }
    #rightBtn { right: 4%; }

    /* Start / finish screen */
    #menu {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 24px; text-align: center;
      background: rgba(0,0,0,.6);
    }
    #menu h1 { margin: 0; font-size: 40px; color: #ffd23f; }
    #menu p { margin: 0; font-size: 17px; line-height: 1.5; }
    #startBtn {
      font-size: 24px; font-weight: 700; padding: 14px 40px;
      border: 0; border-radius: 14px; background: #ffd23f; color: #222;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <div id="hud">
      <span class="pill" id="coins">🪙 0</span>
      <span class="pill" id="lap">Lap 1/3</span>
      <span class="pill" id="timer">0:00.0</span>
      <button id="muteBtn" aria-label="Mute or unmute sound">🔊</button>
    </div>

    <button class="steer" id="leftBtn" aria-label="Steer left">◀</button>
    <button class="steer" id="rightBtn" aria-label="Steer right">▶</button>

    <div id="menu">
      <h1>Auto Rally</h1>
      <p id="menuText">
        Steer the auto with ◀ ▶ (or arrow keys / A D).<br>
        Grab 🪙 coins, dodge cones and potholes.<br>
        ⚡ gives a speed boost. Finish 3 laps!
      </p>
      <p id="bestText"></p>
      <button id="startBtn">Start race</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    // Register the service worker so the game works offline (flight mode).
    // It only works on https:// or http://localhost.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.log('Service worker not registered:', e);
      });
    }
  </script>
</body>
</html>
